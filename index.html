<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday!</title>
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#1a2a6c;
      --cake:#d9a36a;
      --cake2:#c78f56;
      --icing:#ff6bb3;
      --icing2:#ff3d9e;
      --candle:#ffffff;
      --wick:#2a1a12;
      --flame1:#ffd66b;
      --flame2:#ff6a3d;
      --shadow: rgba(0,0,0,.35);
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(circle at 30% 20%, #223a8f 0%, var(--bg2) 40%, var(--bg1) 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#fff;
      overflow:hidden;
    }

    /* Subtle floating confetti */
    .confetti{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.85;
    }

    .card{
      width:min(720px, 95vw);
      padding:18px 18px 26px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.15);
      border-radius:18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
    }

    .title{
      text-align:center;
      margin:6px 0 12px;
      font-weight:800;
      letter-spacing:.2px;
      font-size: clamp(18px, 2.2vw, 24px);
      text-shadow: 0 2px 10px rgba(0,0,0,.35);
    }

    .stage{
      position:relative;
      height: 420px;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding-bottom: 8px;
    }

    /* Cake base */
    .cake{
      position:relative;
      width: 360px;
      max-width: 86vw;
      height: 220px;
      transform: translateY(26px);
      filter: drop-shadow(0 18px 25px rgba(0,0,0,.35));
    }

    .cake .base{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:0;
      width: 320px;
      height: 170px;
      max-width:100%;
      background: linear-gradient(180deg, var(--cake) 0%, var(--cake2) 100%);
      border-radius: 26px;
    }

    .cake .base::before{
      content:"";
      position:absolute;
      top:18px;
      left:10px;
      right:10px;
      height: 26px;
      border-radius: 18px;
      background: rgba(255,255,255,.12);
    }

    /* Icing top */
    .cake .icing{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      top: 30px;
      width: 300px;
      max-width: 100%;
      height: 74px;
      background: linear-gradient(180deg, var(--icing) 0%, var(--icing2) 100%);
      border-radius: 24px 24px 18px 18px;
      overflow:hidden;
    }

    .cake .icing::after{
      content:"";
      position:absolute;
      left:0; right:0;
      top:-8px;
      height: 24px;
      background:
        radial-gradient(circle at 12% 120%, rgba(0,0,0,0) 10px, rgba(0,0,0,.18) 11px) 0 0/24px 24px,
        radial-gradient(circle at 50% 120%, rgba(0,0,0,0) 10px, rgba(0,0,0,.18) 11px) 0 0/24px 24px,
        radial-gradient(circle at 88% 120%, rgba(0,0,0,0) 10px, rgba(0,0,0,.18) 11px) 0 0/24px 24px;
      opacity:.25;
      transform: scaleX(1.1);
    }

    /* Icing drips */
    .drips{
      position:absolute;
      left:0; right:0;
      bottom:-18px;
      height: 40px;
      display:flex;
      justify-content:space-around;
      align-items:flex-start;
      padding: 0 30px;
    }
    .drip{
      width: 20px;
      border-radius: 0 0 12px 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(0,0,0,0)) , var(--icing2);
      transform-origin: top;
      opacity:.95;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.15));
    }
    /* Candles container */
    .candles{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom: 145px; /* near icing top */
      width: 330px;
      max-width: 88vw;
      height: 90px;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      padding: 0 16px;
      gap: 6px;
    }

    .candle{
      position:relative;
      width: 10px;
      height: 78px;
      flex: 0 0 auto;
      transform: translateY(0);
    }

    /* body */
    .candle .stick{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom: 0;
      width: 10px;
      height: 78px;
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(255,255,255,.9), rgba(255,255,255,.6));
      box-shadow: inset 0 -8px 14px rgba(0,0,0,.12);
      background-image:
        repeating-linear-gradient(
          180deg,
          rgba(255,0,140,.0) 0px,
          rgba(255,0,140,.0) 8px,
          rgba(255,0,140,.16) 8px,
          rgba(255,0,140,.16) 16px
        );
    }

    /* wick */
    .candle .wick{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom: 64px;
      width: 4px;
      height: 10px;
      background: var(--wick);
      border-radius: 3px;
      opacity:.85;
    }

    /* flame */
    .candle .flame{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom: 70px;
      width: 10px;
      height: 18px;
      background: radial-gradient(circle at 35% 35%, var(--flame1) 0%, #ffb84a 35%, var(--flame2) 75%, rgba(255,0,0,0) 76%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      filter: drop-shadow(0 0 10px rgba(255, 166, 60, .85));
      animation: flicker 0.12s infinite alternate;
      transform-origin: 50% 100%;
    }

    .candle .flame::after{
      content:"";
      position:absolute;
      left:50%;
      top:2px;
      transform:translateX(-50%);
      width: 6px;
      height: 12px;
      background: rgba(255,255,255,.35);
      border-radius: 50%;
      filter: blur(0.2px);
      opacity:.7;
    }

    @keyframes flicker{
      0%   { transform: translateX(-0.5px) rotate(-6deg) scaleY(.95); opacity:.95; }
      100% { transform: translateX(0.6px) rotate(7deg) scaleY(1.07); opacity:1; }
    }

    /* Warm glow on cake */
    .glow{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom: 138px;
      width: 280px;
      height: 120px;
      background: radial-gradient(circle at 50% 40%, rgba(255,195,80,.35) 0%, rgba(255,140,40,.16) 35%, rgba(0,0,0,0) 70%);
      filter: blur(2px);
      opacity:.9;
      animation: breathe 1.8s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes breathe{
      0%,100%{ transform: translateX(-50%) scale(1); }
      50%{ transform: translateX(-50%) scale(1.04); }
    }

    .message{
      margin-top: 14px;
      text-align:center;
      font-size: 14px;
      opacity:.9;
    }

    .hint{
      margin-top: 10px;
      text-align:center;
      font-size: 12px;
      opacity:.8;
    }
  </style>
</head>
<body>
  <canvas class="confetti" id="confetti"></canvas>

  <div class="card">
    <div class="title">🎂 Happy Birthday! 🎉</div>

    <div class="stage">
      <div class="glow" aria-hidden="true"></div>

      <div class="cake" role="img" aria-label="Birthday cake with 21 candles lit">
        <div class="icing">
          <div class="drips" aria-hidden="true">
            <div class="drip" style="height:26px"></div>
            <div class="drip" style="height:34px"></div>
            <div class="drip" style="height:22px"></div>
            <div class="drip" style="height:30px"></div>
            <div class="drip" style="height:26px"></div>
            <div class="drip" style="height:38px"></div>
            <div class="drip" style="height:24px"></div>
            <div class="drip" style="height:32px"></div>
            <div class="drip" style="height:28px"></div>
          </div>
        </div>

        <div class="base"></div>

        <div class="candles" id="candles" aria-hidden="true"></div>
      </div>
    </div>

    <div class="message">Open this at midnight and enjoy the candles ✨</div>
    <div class="hint">Candles count: <strong>21</strong></div>
  </div>

  <script>
    // Create exactly 21 candles
    const candlesEl = document.getElementById('candles');
    const COUNT = 21;

    for (let i = 0; i < COUNT; i++) {
      const c = document.createElement('div');
      c.className = 'candle';

      const stick = document.createElement('div');
      stick.className = 'stick';

      const wick = document.createElement('div');
      wick.className = 'wick';

      const flame = document.createElement('div');
      flame.className = 'flame';

      // Give each candle a slightly different flicker speed via animation-duration randomness
      const duration = 80 + Math.random() * 120; // ms
      flame.style.animationDuration = duration + 'ms';

      // Slight height variation for visual interest
      const heightJitter = -6 + Math.random() * 12;
      c.style.transform = `translateY(${heightJitter}px)`;

      c.appendChild(stick);
      c.appendChild(wick);
      c.appendChild(flame);
      candlesEl.appendChild(c);
    }

    // Simple confetti
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize(){
      W = canvas.width = window.innerWidth * devicePixelRatio;
      H = canvas.height = window.innerHeight * devicePixelRatio;
    }
    window.addEventListener('resize', resize);
    resize();

    const colors = ['#ffd66b', '#ff6a3d', '#ffffff', '#ff3d9e', '#7cf7ff', '#b7ff6b'];
    const pieces = Array.from({length: 120}, (_, i) => ({
      x: Math.random() * W,
      y: Math.random() * H * 0.4,
      vx: (Math.random() - 0.5) * 2.0,
      vy: 1.2 + Math.random() * 2.2,
      r: 2 + Math.random() * 3,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.2,
      color: colors[i % colors.length]
    }));

    function draw(){
      ctx.clearRect(0,0,W,H);
      for (const p of pieces){
        p.x += p.vx * devicePixelRatio;
        p.y += p.vy * devicePixelRatio;
        p.rot += p.vr;

        if (p.y > H + 20){
          p.y = -20;
          p.x = Math.random() * W;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.r, -p.r/2, p.r*2, p.r);
        ctx.restore();
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
