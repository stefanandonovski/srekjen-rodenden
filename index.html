
<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Среќен роденден ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at center, #3a1731 0%, #180d1d 45%, #080509 100%);
            color: white;
        }

        /* =========================
           START SCREEN
        ========================= */

        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            background:
                radial-gradient(circle at center, #35152d 0%, #120a16 60%, #050307 100%);
            transition: opacity 1.5s ease, visibility 1.5s ease;
        }

        #startScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .start-content {
            animation: gentlePulse 2.5s infinite ease-in-out;
            padding: 30px;
        }

        .start-content h1 {
            font-size: clamp(2.2rem, 9vw, 4rem);
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .tap-text {
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.65;
        }

        @keyframes gentlePulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.85;
            }

            50% {
                transform: scale(1.03);
                opacity: 1;
            }
        }

        /* =========================
           MAIN SCENE
        ========================= */

        #scene {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 2s ease;
        }

        #scene.visible {
            opacity: 1;
        }

        .birthday-container {
            position: relative;
            width: min(90vw, 500px);
            height: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           TITLE
        ========================= */

        .birthday-title {
            position: absolute;
            top: 35px;
            width: 100%;
            text-align: center;

            font-size: clamp(2rem, 8vw, 3.4rem);
            font-weight: 400;

            opacity: 0;
            transform: translateY(-20px);

            transition:
                opacity 1.5s ease,
                transform 1.5s ease;

            text-shadow:
                0 0 10px rgba(255, 150, 200, 0.35),
                0 0 25px rgba(255, 100, 180, 0.15);
        }

        .birthday-title.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================
           CAKE
        ========================= */

        .cake-area {
            position: relative;
            width: 330px;
            height: 300px;

            margin-top: 80px;

            opacity: 0;
            transform: translateY(80px) scale(0.8);

            transition:
                opacity 2s ease,
                transform 2s cubic-bezier(.2,.8,.2,1);
        }

        .cake-area.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Cake plate */

        .plate {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);

            width: 310px;
            height: 28px;

            border-radius: 50%;

            background: linear-gradient(
                to bottom,
                #f9d9e5,
                #d99aae
            );

            box-shadow:
                0 5px 20px rgba(0,0,0,0.4);
        }

        /* Bottom cake */

        .cake-bottom {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);

            width: 270px;
            height: 105px;

            border-radius: 15px 15px 25px 25px;

            background:
                linear-gradient(
                    to right,
                    #8e3153,
                    #c95d7e 50%,
                    #8e3153
                );

            box-shadow:
                inset 0 -15px 0 rgba(80,20,40,0.15),
                0 12px 25px rgba(0,0,0,0.35);
        }

        /* Top cake layer */

        .cake-top {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);

            width: 290px;
            height: 80px;

            border-radius: 50%;

            background:
                linear-gradient(
                    to bottom,
                    #ffe1e8,
                    #f5b5c8
                );

            box-shadow:
                0 5px 15px rgba(0,0,0,0.2);
        }

        /* Cream */

        .cream {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);

            width: 285px;
            height: 45px;

            background: #fff3f5;

            border-radius:
                0 0 50% 50%;

            box-shadow:
                0 5px 10px rgba(0,0,0,0.15);
        }

        /* Cream drops */

        .cream::before,
        .cream::after {
            content: "";

            position: absolute;
            bottom: -18px;

            width: 35px;
            height: 30px;

            background: #fff3f5;

            border-radius: 0 0 50% 50%;
        }

        .cream::before {
            left: 55px;
        }

        .cream::after {
            right: 55px;
        }

        /* =========================
           CANDLES
        ========================= */

        .candles {
            position: absolute;
            bottom: 160px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            align-items: flex-end;
            justify-content: center;

            gap: 35px;

            z-index: 10;
        }

        .candle {
            position: relative;

            width: 70px;
            height: 115px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
            font-weight: 900;

            font-size: 95px;
            line-height: 1;

            color: #fff6f8;

            text-shadow:
                2px 3px 0 #d85c82,
                -1px -1px 0 #d85c82;

            opacity: 0;
            transform: translateY(30px);

            transition:
                opacity 1s ease,
                transform 1s ease;
        }

        .candle.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Candle stripes */

        .candle::after {
            content: "";

            position: absolute;

            width: 8px;
            height: 115px;

            top: 5px;

            background: rgba(255,255,255,0.3);

            border-radius: 10px;

            transform: rotate(-8deg);

            pointer-events: none;
        }

        /* =========================
           FLAMES
        ========================= */

        .flame {
            position: absolute;

            top: -28px;
            left: 50%;

            width: 25px;
            height: 38px;

            transform:
                translateX(-50%)
                scale(0);

            transform-origin: bottom;

            border-radius:
                50% 50% 50% 50% /
                60% 60% 40% 40%;

            background:
                radial-gradient(
                    circle at 50% 65%,
                    #fff 0%,
                    #fff5a0 25%,
                    #ffad33 55%,
                    #ff5c33 100%
                );

            box-shadow:
                0 0 15px #ffb347,
                0 0 35px rgba(255,150,50,0.7);

            transition:
                transform 0.6s cubic-bezier(.2,1.5,.4,1);
        }

        .flame.lit {
            transform:
                translateX(-50%)
                scale(1);

            animation: flicker 0.15s infinite alternate;
        }

        @keyframes flicker {
            from {
                transform:
                    translateX(-50%)
                    scale(1)
                    rotate(-2deg);
            }

            to {
                transform:
                    translateX(-50%)
                    scale(1.05)
                    rotate(2deg);
            }
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            position: absolute;

            bottom: 25px;

            width: 90%;

            text-align: center;

            opacity: 0;
            transform: translateY(20px);

            transition:
                opacity 1.5s ease,
                transform 1.5s ease;
        }

        .message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .personal-message {
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .heart {
            font-size: 1.5rem;
        }

        /* =========================
           CONFETTI
        ========================= */

        .confetti {
            position: fixed;
            top: -20px;

            width: 8px;
            height: 14px;

            opacity: 0;

            z-index: 50;

            animation:
                confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform:
                    translateY(-20px)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;
            }
        }

        /* =========================
           MUSIC BUTTON
        ========================= */

        #musicButton {
            position: fixed;

            right: 18px;
            bottom: 18px;

            width: 42px;
            height: 42px;

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 50%;

            background: rgba(255,255,255,0.08);

            color: white;

            font-size: 18px;

            cursor: pointer;

            opacity: 0;

            transition: opacity 1s ease;

            z-index: 90;
        }

        #musicButton.show {
            opacity: 0.7;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-height: 700px) {
            .birthday-container {
                transform: scale(0.85);
            }
        }

        @media (max-width: 400px) {
            .birthday-container {
                transform: scale(0.88);
            }

            .cake-area {
                margin-top: 70px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         START SCREEN
    ========================== -->

    <div id="startScreen">

        <div class="start-content">

            <h1>Мало изненадување</h1>

            <div class="tap-text">
                чепни го екранот ❤️
            </div>

        </div>

    </div>


    <!-- =========================
         MAIN SCENE
    ========================== -->

    <main id="scene">

        <div class="birthday-container">

            <h1 id="birthdayTitle" class="birthday-title">
                Среќен роденден ❤️
            </h1>


            <!-- CAKE -->

            <div id="cake" class="cake-area">

                <div class="candles">

                    <!-- NUMBER 2 -->

                    <div id="candle2" class="candle">

                        2

                        <div id="flame2" class="flame"></div>

                    </div>


                    <!-- NUMBER 1 -->

                    <div id="candle1" class="candle">

                        1

                        <div id="flame1" class="flame"></div>

                    </div>

                </div>


                <div class="cake-top"></div>

                <div class="cream"></div>

                <div class="cake-bottom"></div>

                <div class="plate"></div>

            </div>


            <!-- MESSAGE -->

            <div id="message" class="message">

                <div class="personal-message">
                    Секоја желба да ти се исполнит,
                    <br>
                    те љубам! <span class="heart">❤️</span>
                </div>

            </div>

        </div>

    </main>


    <!-- MUSIC -->

    <audio id="birthdayMusic" loop preload="auto">
        
           <source src="atlasaudio-birthday-606219.mp3" type="audio/mpeg">
       
    </audio>


    <!-- MUSIC BUTTON -->

    <button id="musicButton" aria-label="Music">
        ♫
    </button>


    <script>

        const startScreen = document.getElementById("startScreen");
        const scene = document.getElementById("scene");

        const cake = document.getElementById("cake");

        const birthdayTitle =
            document.getElementById("birthdayTitle");

        const message =
            document.getElementById("message");

        const candle2 =
            document.getElementById("candle2");

        const candle1 =
            document.getElementById("candle1");

        const flame2 =
            document.getElementById("flame2");

        const flame1 =
            document.getElementById("flame1");

        const music =
            document.getElementById("birthdayMusic");

        const musicButton =
            document.getElementById("musicButton");


        let started = false;


        /* =========================
           START EXPERIENCE
        ========================== */

        startScreen.addEventListener("click", startBirthday);

        startScreen.addEventListener("touchstart", startBirthday);


        function startBirthday(event) {

            if (started) return;

            started = true;

            if (event) {
                event.preventDefault();
            }


            /* Hide start screen */

            startScreen.classList.add("hidden");


            /* Show scene */

            setTimeout(() => {

                scene.classList.add("visible");

            }, 500);


            /* Start music */

            startMusic();


            /*
                Cake slowly appears
            */

            setTimeout(() => {

                cake.classList.add("show");

            }, 900);


            /*
                First candle
            */

            setTimeout(() => {

                candle2.classList.add("show");

            }, 2400);


            /*
                Light first candle
            */

            setTimeout(() => {

                flame2.classList.add("lit");

            }, 3300);


            /*
                Second candle
            */

            setTimeout(() => {

                candle1.classList.add("show");

            }, 3900);


            /*
                Light second candle
            */

            setTimeout(() => {

                flame1.classList.add("lit");

            }, 4800);


            /*
                Birthday title
            */

            setTimeout(() => {

                birthdayTitle.classList.add("show");

            }, 5400);


            /*
                Confetti
            */

            setTimeout(() => {

                createConfetti();

            }, 5500);


            /*
                Personal message
            */

            setTimeout(() => {

                message.classList.add("show");

            }, 6800);

        }


        /* =========================
           MUSIC
        ========================== */

        function startMusic() {

            if (!music.src && !music.querySelector("source")) {
                return;
            }

            music.volume = 0.45;

            music.play()
                .then(() => {

                    musicButton.classList.add("show");

                })
                .catch(() => {

                    console.log("Music could not start.");

                });

        }


        /* MUSIC BUTTON */

        musicButton.addEventListener("click", () => {

            if (music.paused) {

                music.play();

            } else {

                music.pause();

            }

        });


        /* =========================
           CONFETTI
        ========================== */

        function createConfetti() {

            const amount = 100;

            for (let i = 0; i < amount; i++) {

                const piece =
                    document.createElement("div");

                piece.classList.add("confetti");


                /*
                    Random horizontal position
                */

                piece.style.left =
                    Math.random() * 100 + "vw";


                /*
                    Random size
                */

                const size =
                    5 + Math.random() * 7;

                piece.style.width =
                    size + "px";

                piece.style.height =
                    size * 1.6 + "px";


                /*
                    Random animation duration
                */

                piece.style.animationDuration =
                    3 + Math.random() * 4 + "s";


                /*
                    Random delay
                */

                piece.style.animationDelay =
                    Math.random() * 1.5 + "s";


                /*
                    Different colors
                */

                const colors = [
                    "#ff6b9d",
                    "#ffd166",
                    "#ffffff",
                    "#ff9f1c",
                    "#c77dff",
                    "#80ed99"
                ];

                piece.style.background =
                    colors[
                        Math.floor(
                            Math.random() * colors.length
                        )
                    ];


                document.body.appendChild(piece);


                /*
                    Remove after animation
                */

                setTimeout(() => {

                    piece.remove();

                }, 8000);

            }

        }

    </script>

</body>
</html>
